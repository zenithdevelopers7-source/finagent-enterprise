{{- if .Values.ingress.enabled }}
{{- $class := required "ingress.className is required when ingress is enabled" .Values.ingress.className }}
{{- $host := required "ingress.host is required when ingress is enabled" .Values.ingress.host }}
{{- $secret := required "ingress.tlsSecretName is required when ingress is enabled" .Values.ingress.tlsSecretName }}
{{- if not (regexMatch `^([a-z0-9]([-a-z0-9]*[a-z0-9])?\.)+[a-z0-9]([-a-z0-9]*[a-z0-9])?$` $host) }}
{{- fail "ingress.host must be an explicit lowercase DNS hostname without wildcards" }}
{{- end }}
{{- if not .Values.networkPolicy.webIngressPeers }}
{{- fail "networkPolicy.webIngressPeers is required when ingress is enabled" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finagent-web
spec:
  ingressClassName: {{ $class | quote }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ $secret | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finagent-web
                port: {number: 80}
{{- end }}
